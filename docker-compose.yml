services:
  api:
    build: .
    container_name: food_delivery_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./food_delivery.db:/app/food_delivery.db
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: food_delivery_redis
    ports:
      - "6379:6379"
    restart: unless-stopped